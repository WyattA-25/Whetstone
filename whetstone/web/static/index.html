<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Whetstone</title>
<meta name="description" content="Self-improving prompt optimizer: agent teams evolve your prompts and prove it on held-out tests.">
<style>
:root {
  --bg: #f6f5f2; --panel: #ffffff; --ink: #1c1b19; --muted: #6b6760; --line: #e4e1db;
  --accent: #b45309; --accent-soft: #fdf3e7; --good: #15803d; --good-soft: #e9f7ee; --warn: #a16207;
  --mutate: #2563eb; --crossover: #7c3aed; --fresh: #059669; --baseline: #78716c;
  --ins: #dcfce7; --ins-ink: #14532d; --del: #fee2e2; --del-ink: #7f1d1d;
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12110f; --panel: #1b1a17; --ink: #f2efe9; --muted: #a29d94; --line: #2f2d29;
    --accent: #f59e0b; --accent-soft: #2a2114; --good: #4ade80; --good-soft: #13261a; --warn: #fbbf24;
    --mutate: #60a5fa; --crossover: #a78bfa; --fresh: #34d399; --baseline: #a8a29e;
    --ins: #14301f; --ins-ink: #bbf7d0; --del: #3a1717; --del-ink: #fecaca; --shadow: none;
  }
}
:root[data-theme="dark"] {
  --bg: #12110f; --panel: #1b1a17; --ink: #f2efe9; --muted: #a29d94; --line: #2f2d29;
  --accent: #f59e0b; --accent-soft: #2a2114; --good: #4ade80; --good-soft: #13261a; --warn: #fbbf24;
  --mutate: #60a5fa; --crossover: #a78bfa; --fresh: #34d399; --baseline: #a8a29e;
  --ins: #14301f; --ins-ink: #bbf7d0; --del: #3a1717; --del-ink: #fecaca; --shadow: none;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 16px 48px; }
header { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding: 20px 0 8px; }
.brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; }
.brand h1 { margin: 0; font-size: 24px; letter-spacing: -.02em; }
.brand h1 span { color: var(--accent); }
.brand p { margin: 0; color: var(--muted); font-size: 14px; }
select, button { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line);
  border-radius: 8px; padding: 6px 10px; }
button { cursor: pointer; }
.live { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.dot.on { background: var(--good); box-shadow: 0 0 0 0 var(--good); animation: pulse 2s infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--good) 60%, transparent); }
  70% { box-shadow: 0 0 0 8px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
.sub { color: var(--muted); font-size: 13px; margin: 0 0 16px; }
.grid { display: grid; gap: 16px; }
.cards { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.two { grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); }
@media (max-width: 900px) { .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); } .two { grid-template-columns: 1fr; } }
#run { max-width: 100%; min-width: 0; text-overflow: ellipsis; }
@media (max-width: 520px) { .cards { grid-template-columns: 1fr; } #run { flex: 1 1 100%; } .big { font-size: 24px; } }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; box-shadow: var(--shadow); min-width: 0; }
.card h2 { margin: 0 0 10px; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.big { font-size: 28px; font-weight: 700; letter-spacing: -.02em; line-height: 1.15; }
.big .arrow { color: var(--muted); font-weight: 400; margin: 0 4px; }
.hero { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); background: linear-gradient(180deg, var(--accent-soft), var(--panel) 70%); }
.note { color: var(--muted); font-size: 13px; margin-top: 6px; }
.badge { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; margin-top: 8px; }
.badge.good { background: var(--good-soft); color: var(--good); }
.badge.warn { background: var(--accent-soft); color: var(--warn); }
.delta { color: var(--good); font-weight: 600; }
.delta.neg { color: var(--del-ink); }
.section { margin-top: 16px; }
svg text { fill: var(--muted); font-size: 12px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin-top: 8px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
.feed { max-height: 560px; overflow: auto; padding-right: 4px; }
.round { border-top: 1px solid var(--line); padding: 10px 0; }
.round:first-child { border-top: 0; padding-top: 0; }
.round-h { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
.cand { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; padding: 6px 8px;
  border-radius: 8px; cursor: pointer; }
.cand:hover { background: var(--bg); }
.chip { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; padding: 2px 7px; border-radius: 6px; color: #fff; }
.chip.mutate { background: var(--mutate); } .chip.crossover { background: var(--crossover); }
.chip.fresh { background: var(--fresh); } .chip.baseline { background: var(--baseline); }
.scores { font-variant-numeric: tabular-nums; font-size: 13px; color: var(--muted); white-space: nowrap; }
.status { font-size: 12px; font-weight: 600; white-space: nowrap; }
.status.champion { color: var(--accent); } .status.kept { color: var(--ink); } .status.discarded { color: var(--muted); }
pre { white-space: pre-wrap; word-break: break-word; margin: 6px 0 4px; padding: 10px; border-radius: 8px;
  background: var(--bg); border: 1px solid var(--line); font: 12.5px/1.5 ui-monospace, SFMono-Regular, Consolas, monospace; }
.diff ins { background: var(--ins); color: var(--ins-ink); text-decoration: none; border-radius: 3px; }
.diff del { background: var(--del); color: var(--del-ink); border-radius: 3px; }
.diff-controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin-bottom: 8px; }
ol.lessons { margin: 0; padding-left: 20px; } ol.lessons li { margin-bottom: 6px; }
.empty { color: var(--muted); font-size: 14px; padding: 24px 0; text-align: center; }
.tabs { display: flex; gap: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
.tabs button { border: 0; background: none; padding: 5px 12px; border-radius: 7px; color: var(--muted); }
.tabs button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.form { display: grid; gap: 10px; }
.form .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.form label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
.form input, .form select { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; width: 100%; }
.check { display: flex !important; grid-template-columns: none; align-items: flex-start; gap: 8px; color: var(--ink) !important; }
.check input { width: auto; margin-top: 3px; }
.btn { background: var(--accent); color: #fff; border: 0; font-weight: 600; padding: 8px 14px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.ghost { background: none; color: var(--ink); border: 1px solid var(--line); font-weight: 500; }
.msg { font-size: 13px; padding: 8px 10px; border-radius: 8px; background: var(--bg); border: 1px solid var(--line); }
.msg.err { color: var(--del-ink); background: var(--del); border-color: transparent; }
.msg.ok { color: var(--good); background: var(--good-soft); border-color: transparent; }
.msg.warn { color: var(--warn); background: var(--accent-soft); border-color: transparent; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 7px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 600; }
.tablewrap { overflow-x: auto; }
.meter { height: 8px; background: var(--bg); border: 1px solid var(--line); border-radius: 99px; overflow: hidden; margin-top: 8px; }
.meter > i { display: block; height: 100%; background: var(--accent); }
.plans { grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (max-width: 700px) { .plans { grid-template-columns: 1fr; } }
.price { font-size: 40px; font-weight: 800; letter-spacing: -.03em; }
.price small { font-size: 15px; font-weight: 500; color: var(--muted); }
ul.ticks { padding-left: 18px; margin: 10px 0; } ul.ticks li { margin-bottom: 4px; }
.prose h3 { margin: 0 0 6px; font-size: 16px; } .prose p { margin: 0 0 10px; color: var(--muted); }
footer { margin-top: 24px; color: var(--muted); font-size: 12px; }
footer code { font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><h1>Whet<span>stone</span></h1><p>Self-improving prompt optimizer</p></div>
    <nav class="tabs" id="tabs">
      <button data-view="results" class="on">Results</button>
      <button data-view="account" id="tab-account" hidden>Account &amp; runs</button>
      <button data-view="pricing">Pricing</button>
    </nav>
    <select id="run" aria-label="Run"></select>
    <span class="live"><span class="dot" id="livedot"></span><span id="livetxt">-</span></span>
    <button id="theme" title="Toggle theme" aria-label="Toggle theme">◐</button>
  </header>
  <section id="view-results">
    <p class="sub" id="objective"></p>
    <div id="app"><div class="empty">Loading runs...</div></div>
  </section>
  <section id="view-account" hidden></section>
  <section id="view-pricing" hidden></section>

  <footer id="foot"></footer>
</div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let METRIC = "success", current = null, timer = null, openCands = new Set(), diffSel = null;

function fmt(v, m = METRIC) {
  if (v === null || v === undefined || Number.isNaN(v)) return "-";
  if (m === "success") return (v * 100).toFixed(1) + "%";
  if (m === "tokens") return Math.round(v).toLocaleString();
  if (m === "seconds") return v.toFixed(2) + "s";
  if (m === "usd") return "$" + v.toFixed(v < 0.01 ? 5 : 3);
  return (+v).toPrecision(3);
}
const val = (agg, m = METRIC) => agg ? agg[m] : null;

// ---- theme -------------------------------------------------------------------------------------
(function () {
  let t = null; try { t = localStorage.getItem("ws-theme"); } catch (e) {}
  if (t) document.documentElement.dataset.theme = t;
  $("#theme").onclick = () => {
    const dark = matchMedia("(prefers-color-scheme: dark)").matches;
    const cur = document.documentElement.dataset.theme || (dark ? "dark" : "light");
    const next = cur === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem("ws-theme", next); } catch (e) {}
  };
})();

// ---- data --------------------------------------------------------------------------------------
async function getJSON(u) { const r = await fetch(u); if (!r.ok) throw new Error(r.status); return r.json(); }

async function loadRuns() {
  const runs = await getJSON("/api/runs");
  const sel = $("#run");
  if (!runs.length) { $("#app").innerHTML = '<div class="empty">No runs yet. Start one with <code>python -m whetstone.run --task banking77</code>.</div>'; return; }
  const want = decodeURIComponent(location.hash.slice(1)) || runs[0].run_id;
  sel.innerHTML = runs.map(r => `<option value="${esc(r.run_id)}" ${r.run_id === want ? "selected" : ""}>${esc(r.run_id)} · ${esc(r.task)} · round ${r.round_done}/${r.rounds}</option>`).join("");
  sel.onchange = () => { location.hash = sel.value; openCands.clear(); diffSel = null; loadRun(sel.value); };
  loadRun(sel.value);
}

async function loadRun(id) {
  clearTimeout(timer);
  try { current = await getJSON("/api/runs/" + encodeURIComponent(id)); render(); }
  catch (e) { $("#app").innerHTML = `<div class="empty">Could not load run (${esc(e.message)}).</div>`; }
  const live = current && !current.summary.stopped;
  $("#livedot").className = "dot" + (live ? " on" : "");
  $("#livetxt").textContent = live ? "live · refreshing" : (current ? "finished" : "-");
  if (live) timer = setTimeout(() => loadRun(id), 15000);
}

// ---- render ------------------------------------------------------------------------------------
function render() {
  const { summary: s, rounds, candidates, heldout } = current;
  METRIC = s.objective.metric;
  const obj = s.objective;
  $("#objective").textContent = `Objective: ${obj.direction}imize ${obj.metric}` +
    (obj.constraints || []).map(c => `, subject to ${c.metric} ${c.op} ${c.value}${c.relative_to_baseline ? " vs baseline" : ""}`).join("") +
    ` · task ${s.task} · optimizer + scoring model ${s.models ? s.models.optimizer : "-"}`;

  const base = s.baseline, ch = s.champion, u = s.usage || {};
  const dVal = (ch.val ?? 0) - (base.val ?? 0);
  let held;
  if (heldout) {
    const b = heldout.baseline[METRIC], c = heldout.best[METRIC], d = heldout.paired_diff;
    const pts = METRIC === "success" ? `${d.mean >= 0 ? "+" : ""}${(d.mean * 100).toFixed(1)} pts` : fmt(d.mean);
    const ci = METRIC === "success" ? `95% CI ${(d.ci95[0]*100).toFixed(1)} to ${(d.ci95[1]*100).toFixed(1)} pts` : "";
    held = `<div class="card hero"><h2>Held-out test · ${heldout.n_heldout} unseen examples</h2>
      <div class="big">${fmt(b.mean)}<span class="arrow">→</span>${fmt(c.mean)}</div>
      <div class="note"><span class="delta ${d.mean < 0 ? "neg" : ""}">${pts}</span> · ${(heldout.relative_improvement*100).toFixed(1)}% relative · ${ci}</div>
      <span class="badge ${heldout.significant ? "good" : "warn"}">${heldout.significant ? "Statistically significant" : "Directional only"}</span></div>`;
  } else {
    held = `<div class="card hero"><h2>Held-out test</h2><div class="big">Pending</div>
      <div class="note">Run after optimization on examples the agents never saw. Hash <code>${esc((s.heldout_hash || "").slice(0, 12))}</code> is verified first.</div></div>`;
  }
  const status = s.stopped ? (s.stopped === "completed" ? "Completed" : s.stopped) : "Running";
  const cards = `<div class="grid cards">
    ${held}
    <div class="card"><h2>Validation · used for selection</h2>
      <div class="big">${fmt(base.val)}<span class="arrow">→</span>${fmt(ch.val)}</div>
      <div class="note"><span class="delta ${dVal < 0 ? "neg" : ""}">${METRIC === "success" ? (dVal >= 0 ? "+" : "") + (dVal*100).toFixed(1) + " pts" : fmt(dVal)}</span> · best is <code>${esc(ch.id)}</code>, checked ${ch.val_runs}×</div></div>
    <div class="card"><h2>Rounds</h2><div class="big">${Math.max(0, s.round_done)} / ${s.rounds}</div>
      <div class="note">${esc(status)} · ${candidates.filter(c => c.strategy !== "baseline").length} prompts proposed</div></div>
    <div class="card"><h2>Spend</h2>
      <div class="big">$${((u.optimizer?.usd || 0) + (u.scoring?.usd || 0)).toFixed(3)}</div>
      <div class="note">Agents (ours) $${(u.optimizer?.usd || 0).toFixed(4)} · scoring (customer key) $${(u.scoring?.usd || 0).toFixed(4)}</div></div>
  </div>`;

  const chart = `<div class="card section"><h2>Score per round</h2>${chartSVG(rounds, base.val)}
    <div class="legend"><span><i style="background:var(--accent)"></i>Best prompt (validation, running mean)</span>
    <span><i style="background:var(--mutate)"></i>Mutate</span><span><i style="background:var(--crossover)"></i>Crossover</span>
    <span><i style="background:var(--fresh)"></i>Fresh</span><span><i style="border:2px dashed var(--baseline);background:none"></i>Baseline</span>
    <span>Dots = each proposal's training-batch score</span></div></div>`;

  const two = `<div class="grid two section">
    <div class="card"><h2>Agent feed</h2><div class="feed">${feedHTML(rounds, candidates)}</div></div>
    <div class="grid" style="align-content:start">
      <div class="card"><h2>Lessons from the analyst agent</h2>${(s.lessons || []).length ? `<ol class="lessons">${s.lessons.map(l => `<li>${esc(l)}</li>`).join("")}</ol>` : '<div class="note">None yet.</div>'}</div>
      <div class="card"><h2>How the prompt evolved</h2>${diffHTML(candidates, base)}</div>
    </div></div>`;

  const scroll = $(".feed") ? $(".feed").scrollTop : 0;
  $("#app").innerHTML = cards + chart + two;
  $(".feed").scrollTop = scroll;
  $("#foot").innerHTML = `Held-out set is never used for selection or lessons (enforced in code) · held-out hash <code>${esc(s.heldout_hash || "-")}</code> · run <code>${esc(s.run_id)}</code>`;
  bindFeed(); bindDiff(candidates, base);
}

function chartSVG(rounds, baseVal) {
  if (!rounds.length) return '<div class="empty">Waiting for the baseline...</div>';
  const W = 800, H = 280, L = 48, R = 16, T = 12, B = 32;
  const total = Math.max(current.summary.rounds, rounds[rounds.length - 1].round, 1);
  const pts = [];
  rounds.forEach(r => (r.candidates || []).forEach(c => { const v = val(c.train); if (v != null) pts.push(v); }));
  const line = rounds.map(r => ({ x: r.round, y: val(r.champion_val), promoted: r.promoted && r.round > 0 }));
  const all = pts.concat(line.map(p => p.y)).concat([baseVal]).filter(v => v != null);
  let lo = Math.min(...all), hi = Math.max(...all);
  const pad = (hi - lo) * 0.12 || 0.05; lo -= pad; hi += pad;
  if (METRIC === "success") { lo = Math.max(0, lo); hi = Math.min(1, hi); }
  const X = i => L + (W - L - R) * i / total, Y = v => T + (H - T - B) * (1 - (v - lo) / (hi - lo));
  let g = "";
  for (let k = 0; k <= 4; k++) {
    const v = lo + (hi - lo) * k / 4;
    g += `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${L - 8}" y="${Y(v) + 4}" text-anchor="end">${fmt(v)}</text>`;
  }
  for (let i = 0; i <= total; i++) g += `<text x="${X(i)}" y="${H - 10}" text-anchor="middle">${i === 0 ? "base" : i}</text>`;
  if (baseVal != null) g += `<line x1="${L}" x2="${W - R}" y1="${Y(baseVal)}" y2="${Y(baseVal)}" stroke="var(--baseline)" stroke-dasharray="5 5" stroke-width="1.5"/>`;
  rounds.forEach(r => (r.candidates || []).forEach((c, j) => {
    const v = val(c.train); if (v == null || r.round === 0) return;
    const jit = ((j % 5) - 2) * 6;
    g += `<circle cx="${X(r.round) + jit}" cy="${Y(v)}" r="4.5" fill="var(--${c.strategy})" opacity=".75"><title>${esc(c.id)}: batch ${fmt(v)}${c.val ? ", val " + fmt(val(c.val)) : ""}</title></circle>`;
  }));
  const path = line.filter(p => p.y != null).map((p, i) => `${i ? "L" : "M"}${X(p.x)},${Y(p.y)}`).join(" ");
  g += `<path d="${path}" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linejoin="round"/>`;
  line.forEach(p => { if (p.y != null) g += `<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="${p.promoted ? 6.5 : 4}" fill="${p.promoted ? "var(--accent)" : "var(--panel)"}" stroke="var(--accent)" stroke-width="2.5"><title>round ${p.x}: best ${fmt(p.y)}${p.promoted ? " (new best)" : ""}</title></circle>`; });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Score per round">${g}</svg>`;
}

function feedHTML(rounds, cands) {
  const byRound = {};
  cands.forEach(c => (byRound[c.round] = byRound[c.round] || []).push(c));
  const order = Object.keys(byRound).map(Number).sort((a, b) => b - a);
  if (!order.length) return '<div class="note">No proposals yet.</div>';
  return order.map(r => {
    const rd = rounds.find(x => x.round === r);
    const list = byRound[r].map(c => {
      const st = c.status || "discarded";
      const label = c.strategy === "baseline" ? "starting prompt" : st === "champion" ? "★ new best" : st === "kept" ? "validated" : "discarded";
      const open = openCands.has(c.id);
      return `<div class="cand" data-id="${esc(c.id)}">
        <span class="chip ${esc(c.strategy)}">${esc(c.strategy)}</span>
        <span class="scores">batch ${fmt(val(c.train))}${c.val ? ` · val ${fmt(val(c.val))}` : ""} · ${fmt(val(c.train, "tokens"), "tokens")} tok/ex</span>
        <span class="status ${esc(st)}">${label}</span></div>
        ${open ? `<pre>${esc(c.prompt)}</pre>` : ""}`;
    }).join("");
    return `<div class="round"><div class="round-h"><b>${r === 0 ? "Baseline" : "Round " + r}</b><span>${rd && rd.promoted && r > 0 ? "new best prompt" : ""}</span></div>${list}</div>`;
  }).join("");
}

function bindFeed() {
  document.querySelectorAll(".cand").forEach(el => el.onclick = () => {
    const id = el.dataset.id; openCands.has(id) ? openCands.delete(id) : openCands.add(id); render();
  });
}

// ---- prompt diff (word-level LCS) --------------------------------------------------------------
function wordDiff(a, b) {
  const A = a.split(/(\s+)/), B = b.split(/(\s+)/), n = A.length, m = B.length;
  if (n * m > 4e6) return `<pre>${esc(b)}</pre>`;
  const dp = Array.from({ length: n + 1 }, () => new Uint16Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    dp[i][j] = A[i] === B[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  let i = 0, j = 0, out = "";
  while (i < n && j < m) {
    if (A[i] === B[j]) { out += esc(A[i]); i++; j++; }
    else if (dp[i + 1][j] >= dp[i][j + 1]) { out += `<del>${esc(A[i])}</del>`; i++; }
    else { out += `<ins>${esc(B[j])}</ins>`; j++; }
  }
  while (i < n) out += `<del>${esc(A[i++])}</del>`;
  while (j < m) out += `<ins>${esc(B[j++])}</ins>`;
  return `<pre class="diff">${out}</pre>`;
}

function lineage(cands, base) {
  const champs = cands.filter(c => c.status === "champion" && c.strategy !== "baseline").sort((a, b) => a.round - b.round);
  return [{ id: "baseline", prompt: base.prompt }].concat(champs);
}

function diffHTML(cands, base) {
  const L = lineage(cands, base);
  if (L.length < 2) return '<div class="note">The baseline is still the best prompt.</div>';
  diffSel = diffSel || { from: 0, to: L.length - 1 };
  const opts = sel => L.map((c, i) => `<option value="${i}" ${i === sel ? "selected" : ""}>${esc(c.id)}</option>`).join("");
  return `<div class="diff-controls">from <select id="dfrom">${opts(diffSel.from)}</select> to <select id="dto">${opts(diffSel.to)}</select>
    <span><ins style="background:var(--ins);color:var(--ins-ink);text-decoration:none;padding:0 4px;border-radius:3px">added</ins>
    <del style="background:var(--del);color:var(--del-ink);padding:0 4px;border-radius:3px">removed</del></span></div>
    ${wordDiff(L[diffSel.from].prompt || "", L[diffSel.to].prompt || "")}`;
}

function bindDiff() {
  const f = $("#dfrom"), t = $("#dto");
  if (!f) return;
  f.onchange = t.onchange = () => { diffSel = { from: +f.value, to: +t.value }; render(); };
}

// ---- views / tabs ------------------------------------------------------------------------------
let CONFIG = null;
// Session: the Cognito ID token lives only in this tab's sessionStorage and is sent as a Bearer header.
const session = {
  get() { try { return JSON.parse(sessionStorage.getItem("ws-session") || "null"); } catch (e) { return null; } },
  set(v) { try { v ? sessionStorage.setItem("ws-session", JSON.stringify(v)) : sessionStorage.removeItem("ws-session"); } catch (e) {} },
};
function authHeaders() { const s = session.get(); return s ? { Authorization: "Bearer " + s.id_token } : {}; }
async function post(u, body, method = "POST") {
  const r = await fetch(u, { method, headers: { "Content-Type": "application/json", ...authHeaders() }, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401 && !u.endsWith("/login")) { session.set(null); renderAccount(); }
  if (!r.ok) throw new Error(j.detail || r.status);
  return j;
}
async function getAuthed(u) {
  const r = await fetch(u, { headers: authHeaders() });
  if (r.status === 401) { session.set(null); throw new Error("signed out"); }
  if (!r.ok) throw new Error(r.status);
  return r.json();
}
function loginView() {
  $("#view-account").innerHTML = `<div class="card section" style="max-width:420px;margin:24px auto">
    <h2>Customer sign-in</h2><p class="note">Sign in to manage your API keys, start optimization runs, and see your usage.
    Accounts are created during onboarding (Amazon Cognito).</p>
    <form class="form" id="loginform" autocomplete="on">
      <label>Email<input id="l-email" type="email" autocomplete="username" required></label>
      <label>Password<input id="l-pass" type="password" autocomplete="current-password" required></label>
      <div><button class="btn" type="submit">Sign in</button></div><div id="l-msg"></div></form></div>`;
  $("#loginform").onsubmit = async e => {
    e.preventDefault(); const m = $("#l-msg"); m.className = "msg"; m.textContent = "Signing in...";
    try {
      const r = await post("/api/auth/login", { email: $("#l-email").value, password: $("#l-pass").value });
      session.set({ id_token: r.id_token, email: r.email }); renderAccount();
    } catch (err) { $("#l-pass").value = ""; m.className = "msg err"; m.textContent = err.message; }
  };
}
function show(view) {
  ["results", "account", "pricing"].forEach(v => { $("#view-" + v).hidden = v !== view; });
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.view === view));
  $("#run").hidden = $(".live").hidden = view !== "results";
  if (view === "account") renderAccount();
  if (view === "pricing") renderPricing();
}
document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => show(b.dataset.view));

// ---- pricing -----------------------------------------------------------------------------------
function renderPricing() {
  const P = CONFIG.plans, x = CONFIG.extra_run_usd;
  const plan = (p, k, hl) => `<div class="card ${hl ? "hero" : ""}"><h2>${esc(p.name)}</h2>
    <div class="price">$${p.usd_per_month}<small> / month${p.locked_months ? `, locked ${p.locked_months} months` : ""}</small></div>
    <ul class="ticks"><li><b>${p.included_runs} optimization runs</b> included each month</li><li>Extra runs <b>$${x}</b> each</li>
    <li>Scoring runs on <b>your own AI API key</b></li><li>Held-out proof on every run</li></ul>
    <div class="note">${k === "founding" ? "For our first customers. Price locked for 12 months." : "List price."}</div></div>`;
  $("#view-pricing").innerHTML = `<div class="grid plans section">${plan(P.founding, "founding", true)}${plan(P.standard, "standard")}</div>
    <div class="grid plans section prose">
      <div class="card"><h3>Your own API key</h3><p>Whetstone's agents (proposers, crossover, analyst) run on our account; that part is included.
        Scoring the candidate prompts on your examples, usually 90%+ of a run's tokens, runs on <b>your</b> AI provider key, so it bills to your
        provider at your rates. Your prompt is optimized against the exact model you run in production, and your data goes to a provider you already trust.</p>
        <p>Keys are encrypted with AWS KMS, never shown again or logged, and you can revoke them at any time. Before every run you see the estimated
        tokens and cost on your key and confirm it, and you set a per-run spending limit.</p></div>
      <div class="card"><h3>What counts as a run</h3><p>One run is one full optimization of one prompt (or prompt set): baseline, up to N rounds, and the final
        held-out test. Re-running the held-out test or viewing results is free. A run that fails because of our bug doesn't count. A cancelled run
        counts only if more than one round finished. Unused runs don't roll over.</p>
        <h3>Roadmap</h3><p>Hosted scoring, where we pay for scoring tokens, is not offered yet.</p></div>
    </div>`;
}

// ---- account (local demo) ----------------------------------------------------------------------
const PROVIDERS = { "Luminal": "https://flash.luminal.cloud/v1", "OpenAI": "https://api.openai.com/v1",
  "Anthropic (OpenAI-compatible)": "https://api.anthropic.com/v1/", "Other OpenAI-compatible": "" };
let lastEstimate = null;

async function renderAccount() {
  const V = $("#view-account");
  if (!session.get()) { loginView(); return; }
  let A;
  try { A = await getAuthed("/api/account"); } catch (e) {
    if (!session.get()) { loginView(); return; }
    V.innerHTML = `<div class="empty">Account API unavailable (${esc(e.message)}).</div>`; return; }
  const q = A.quote, pct = Math.min(100, 100 * q.used / q.included);
  const keyRows = A.keys.length ? A.keys.map(k => `<tr><td>${esc(k.provider)}</td><td><code>${esc(k.model)}</code></td>
      <td>${esc(k.added_at.replace("T", " ").replace("+00:00", " UTC"))}</td><td>validated ✓</td>
      <td><button class="btn ghost" data-revoke="${esc(k.key_id)}">Revoke</button></td></tr>`).join("")
    : `<tr><td colspan="5" class="note">No keys yet. Add one below.</td></tr>`;
  const usageRows = A.usage.length ? A.usage.slice().reverse().map(u => `<tr><td><code>${esc(u.run_id)}</code></td><td>${esc(u.status)}</td>
      <td>${u.counted ? "yes" : "no"}${u.extra_run ? " (extra)" : ""}</td><td>$${(+u.optimizer_usd || 0).toFixed(4)}</td>
      <td>~$${(+u.scoring_usd_est || 0).toFixed(4)}</td><td>$${(+u.overage_usd || 0).toFixed(2)} ${u.payment_status && u.payment_status !== "n/a" ? "· " + esc(u.payment_status) : ""}</td></tr>`).join("")
    : `<tr><td colspan="6" class="note">No runs yet this month.</td></tr>`;
  V.innerHTML = `<div class="grid two section">
    <div class="card"><h2>Plan · ${esc(session.get().email || "")} <button class="btn ghost" id="logout" style="float:right;padding:2px 10px;font-size:12px">Sign out</button></h2>
      <div class="big">${esc(A.plan.name)} · $${A.plan.usd_per_month}/mo</div>
      <div class="note">${q.used} of ${q.included} included runs used this month${q.next_is_extra ? ` · <b>next run costs $${q.extra_run_usd}</b>` : ""}</div>
      <div class="meter"><i style="width:${pct}%"></i></div>
      <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="b-plan" type="button">Choose a plan</button>
        <button class="btn ghost" id="b-portal" type="button">Manage billing</button></div><div id="b-msg"></div>
      <div class="form" style="margin-top:12px"><label>Switch plan (demo)<select id="plan">
        ${Object.entries(CONFIG.plans).map(([k, p]) => `<option value="${k}" ${p.name === A.plan.name ? "selected" : ""}>${esc(p.name)} ($${p.usd_per_month}/mo, ${p.included_runs} runs)</option>`).join("")}
      </select></label></div></div>
    <div class="card"><h2>Your AI provider keys</h2><div class="tablewrap"><table><tr><th>Provider</th><th>Model</th><th>Added</th><th>Status</th><th></th></tr>${keyRows}</table></div>
      <form class="form" id="keyform" style="margin-top:12px" autocomplete="off">
        <div class="row"><label>Provider<select id="k-prov">${Object.keys(PROVIDERS).map(p => `<option>${esc(p)}</option>`).join("")}</select></label>
          <label>Model<input id="k-model" placeholder="deepseek-ai/DeepSeek-V4.1-Flash" required></label></div>
        <label>Base URL<input id="k-url" value="${PROVIDERS.Luminal}"></label>
        <label>API key<input id="k-key" type="password" autocomplete="new-password" required placeholder="paste key; it is encrypted with AWS KMS and never shown again"></label>
        <div class="row"><label>Input price $/1M tokens<input id="k-pin" type="number" step="0.01" value="0.10"></label>
          <label>Output price $/1M tokens<input id="k-pout" type="number" step="0.01" value="0.40"></label></div>
        <div><button class="btn" type="submit">Validate &amp; save key</button></div><div id="k-msg"></div></form></div>
  </div>
  <div class="card section"><h2>Start an optimization run</h2>
    <form class="form" id="runform">
      <div class="row"><label>Task<select id="r-task">${Object.entries(CONFIG.tasks).map(([k, d]) => `<option value="${k}">${esc(d)}</option>`).join("")}</select></label>
        <label>Rounds<input id="r-rounds" type="number" min="1" max="20" value="6"></label>
        <label>Score with key<select id="r-key">${A.keys.map(k => `<option value="${esc(k.key_id)}">${esc(k.provider)} · ${esc(k.model)}</option>`).join("")}</select></label>
        <label>Spending limit on your key ($/run)<input id="r-max" type="number" min="0.01" step="0.01" value="2.00"></label></div>
      <div><button class="btn ghost" type="button" id="r-est" ${A.keys.length ? "" : "disabled"}>Estimate cost</button></div>
      <div id="r-out"></div></form></div>
  <div class="card section"><h2>Usage log · this account</h2><div class="tablewrap"><table>
    <tr><th>Run</th><th>Status</th><th>Counted</th><th>Our agents</th><th>Your key (est.)</th><th>Overage</th></tr>${usageRows}</table></div></div>`;

  $("#logout").onclick = () => { session.set(null); loginView(); };
  const go = async (u) => { const m = $("#b-msg"); m.className = "msg"; m.textContent = "Opening AWS billing...";
    try { const r = await post(u, {}); if (r.redirect) location.href = r.redirect; else { m.className = "msg ok"; m.textContent = "Plan change applied" + (r.effectiveAt ? " (effective " + r.effectiveAt + ")" : "") + "."; } }
    catch (err) { m.className = "msg err"; m.textContent = err.message; } };
  $("#b-plan").onclick = () => go("/api/billing/pricing");
  $("#b-portal").onclick = () => go("/api/billing/portal");
  $("#plan").onchange = async e => { await post("/api/account/plan", { plan: e.target.value }); renderAccount(); };
  $("#k-prov").onchange = e => { $("#k-url").value = PROVIDERS[e.target.value]; };
  document.querySelectorAll("[data-revoke]").forEach(b => b.onclick = async () => {
    if (!confirm("Revoke this key? Runs can no longer use it.")) return;
    await post("/api/account/keys/" + b.dataset.revoke, null, "DELETE"); renderAccount(); });
  $("#keyform").onsubmit = async e => {
    e.preventDefault(); const m = $("#k-msg"); m.className = "msg"; m.textContent = "Validating with one tiny test call...";
    try {
      await post("/api/account/keys", { provider: $("#k-prov").value, base_url: $("#k-url").value, model: $("#k-model").value,
        api_key: $("#k-key").value, price_in_per_m: +$("#k-pin").value, price_out_per_m: +$("#k-pout").value });
      $("#k-key").value = ""; renderAccount();
    } catch (err) { $("#k-key").value = ""; m.className = "msg err"; m.textContent = err.message; }
  };
  const body = () => ({ task: $("#r-task").value, rounds: +$("#r-rounds").value, key_id: $("#r-key").value, max_usd: +$("#r-max").value });
  $("#r-est").onclick = async () => {
    const out = $("#r-out");
    try { lastEstimate = await post("/api/account/estimate", body()); } catch (err) { out.innerHTML = `<div class="msg err">${esc(err.message)}</div>`; return; }
    const E = lastEstimate.estimate, Q = lastEstimate.quote;
    out.innerHTML = `<div class="msg">Estimated scoring on <b>your ${esc(lastEstimate.key.provider)} key</b>: about <b>${E.scoring_tokens.toLocaleString()} tokens ≈ $${E.scoring_usd.toFixed(2)}</b>
        <div class="note">${esc(E.formula)}. The run stops gracefully, keeping its best result, if it reaches your $${lastEstimate.spending_limit_usd.toFixed(2)} limit.</div></div>
      ${lastEstimate.limit_may_stop_early ? `<div class="msg warn" style="margin-top:8px">The estimate is above your spending limit, so this run will likely stop early.</div>` : ""}
      ${Q.next_is_extra ? `<div class="msg warn" style="margin-top:8px">You've used ${Q.used} of ${Q.included} included runs this month. This run is an extra run: <b>$${Q.extra_run_usd}</b>.</div>
        <label class="check" style="margin-top:8px"><input type="checkbox" id="r-cx"> I agree to the $${Q.extra_run_usd} extra-run charge</label>` : ""}
      <label class="check" style="margin-top:8px"><input type="checkbox" id="r-cc"> I understand this uses about $${E.scoring_usd.toFixed(2)} of tokens on my own key (max $${lastEstimate.spending_limit_usd.toFixed(2)})</label>
      <div style="margin-top:8px"><button class="btn" type="button" id="r-go" disabled>Start run</button></div>`;
    const sync = () => { $("#r-go").disabled = !($("#r-cc").checked && (!Q.next_is_extra || $("#r-cx").checked)); };
    $("#r-cc").onchange = sync; if ($("#r-cx")) $("#r-cx").onchange = sync;
    $("#r-go").onclick = async () => {
      try {
        const r = await post("/api/account/runs", { ...body(), confirm_cost: true, confirm_extra: !!($("#r-cx") && $("#r-cx").checked) });
        out.innerHTML = `<div class="msg ok">Started <code>${esc(r.run_id)}</code>${r.extra_run ? " (extra run)" : ""}. It appears under Results once the baseline is scored.</div>`;
        setTimeout(renderAccount, 1500);
      } catch (err) { out.innerHTML += `<div class="msg err" style="margin-top:8px">${esc(err.message)}</div>`; }
    };
  };
}

getJSON("/api/config").then(c => { CONFIG = c; $("#tab-account").hidden = !c.account_api; }).catch(() => {});
loadRuns().catch(e => $("#app").innerHTML = `<div class="empty">Could not reach the API (${esc(e.message)}).</div>`);
</script>
